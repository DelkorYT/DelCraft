name: Package and Release WoW Addon

on:
  push:
    branches:
      - main
    paths:
      - '*.toc'
      - '*.lua'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine addon name
        id: addon
        run: |
          toc_file=$(ls *.toc 2>/dev/null | head -n 1)
          if [[ -n "$toc_file" ]]; then
            addon_name=$(basename "$toc_file" .toc)
          else
            addon_name=$(basename ${{ github.repository }})
          fi
          echo "addon_name=$addon_name" >> $GITHUB_OUTPUT
          echo "Found addon name: $addon_name"

      - name: Calculate next semantic version
        id: semver
        uses: PaulHatch/semantic-version@v5.0.2
        with:
          enable_prerelease_mode: false
          major_pattern: "(?i)major|breaking|feat!"           # case-insensitive: Major, BREAKING, feat!, Feat!, etc.
          minor_pattern: "(?i)feature|feat|minor|add"         # Feature, FEAT, feat, Minor, etc.
          patch_pattern: "(?i)fix|bug|patch|chore|docs|refactor|test|style"  # Fix, FIX, fix, Chore, etc.
          format: "${major}.${minor}.${patch}"
          tag_prefix: "v"
          bump_each_commit: false

      - name: Create and push tag (only if version changed)
        if: steps.semver.outputs.version != ''
        run: |
          NEW_TAG="v${{ steps.semver.outputs.version }}"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Package addon
        run: |
          mkdir -p release/${{ steps.addon.outputs.addon_name }}
          rsync -av --exclude='.pkgmeta' --exclude='.github/' --exclude='.gitignore' . release/${{ steps.addon.outputs.addon_name }}/
          cd release
          zip -r ${{ steps.addon.outputs.addon_name }}-${{ steps.semver.outputs.version }}.zip ${{ steps.addon.outputs.addon_name }}
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.semver.outputs.version != ''
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: ${{ steps.addon.outputs.addon_name }} v${{ steps.semver.outputs.version }}
          body: |
            Automated release for commit ${{ github.sha }}
            Version bump: ${{ steps.semver.outputs.version_type }}
            Commits since last tag:
            ${{ github.event.head_commit.message }}
          files: release/${{ steps.addon.outputs.addon_name }}-${{ steps.semver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon.outputs.addon_name }}-v${{ steps.semver.outputs.version }}
          path: release/${{ steps.addon.outputs.addon_name }}-${{ steps.semver.outputs.version }}.zip
          retention-days: 7
