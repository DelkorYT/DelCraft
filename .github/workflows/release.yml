name: Package and Release WoW Addon

on:
  push:
    branches:
      - main
    paths:
      - '*.toc'
      - '*.lua'
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine addon name
        id: addon
        run: |
          # Try to find the first .toc file in the root
          toc_file=$(ls *.toc 2>/dev/null | head -n 1)
          if [[ -n "$toc_file" ]]; then
            # Use the .toc file name (without .toc) as addon name
            addon_name=$(basename "$toc_file" .toc)
          else
            # Fallback to repository name
            addon_name=$(basename ${{ github.repository }})
          fi
          echo "addon_name=$addon_name" >> $GITHUB_OUTPUT
          echo "Found addon name: $addon_name"

      - name: Determine version and create tag for main commits
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Get the latest tag or default to v0.0.0
            latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
            # Extract version numbers (e.g., v1.0.0 -> 1, 0, 0)
            version_regex="v([0-9]+)\.([0-9]+)\.([0-9]+)"
            if [[ $latest_tag =~ $version_regex ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}
              # Increment patch version
              new_patch=$((patch + 1))
              version="v${major}.${minor}.${new_patch}"
            else
              version="v0.0.1"
            fi
            echo "Creating tag $version"
            git tag $version || echo "Tag $version already exists, using existing tag"
            git push origin $version || true
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "release_name=${{ steps.addon.outputs.addon_name }}-$version" >> $GITHUB_OUTPUT
            echo "changelog=Automated release for commit ${{ github.sha }} (Tag $version)" >> $GITHUB_OUTPUT
          else
            version=${{ github.ref_name }}
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "release_name=${{ steps.addon.outputs.addon_name }}-$version" >> $GITHUB_OUTPUT
            echo "changelog=Release $version" >> $GITHUB_OUTPUT
          fi

      - name: Package addon
        run: |
          mkdir -p release/${{ steps.addon.outputs.addon_name }}
          # Copy all files except excluded ones
          rsync -av --exclude='.pkgmeta' --exclude='.github/' --exclude='.gitignore' . release/${{ steps.addon.outputs.addon_name }}/
          cd release
          zip -r ${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}.zip ${{ steps.addon.outputs.addon_name }}
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: false
          files: release/${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_ID: 1298139
        run: |
          python -c "
          import requests
          import json
          import os
          api_token = os.getenv('CURSEFORGE_API_TOKEN')
          project_id = os.getenv('PROJECT_ID')
          if not api_token or not project_id:
            print('Error: CURSEFORGE_API_TOKEN or PROJECT_ID not set')
            exit(1)
          with open('release/${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}.zip', 'rb') as f:
              metadata = {
                  'changelog': '${{ steps.version.outputs.changelog }}',
                  'displayName': '${{ steps.version.outputs.release_name }}',
                  'gameVersions': ['11404'], # Replace with your WoW version (e.g., Classic 1.15.0)
                  'releaseType': 'release'
              }
              response = requests.post(
                  f'https://wow.curseforge.com/api/projects/{project_id}/upload-file',
                  headers={'X-Api-Token': api_token},
                  data={'metadata': json.dumps(metadata)},
                  files={'file': ('${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}.zip', f, 'application/zip')}
              )
              if response.status_code == 200:
                  print('Successfully uploaded to CurseForge!')
              else:
                  print(f'Upload failed: {response.text}')
                  exit(1)
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}
          path: release/${{ steps.addon.outputs.addon_name }}-${{ steps.version.outputs.version }}.zip
          retention-days: 7
