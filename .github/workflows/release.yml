name: Package and Release DelCraft Addon

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git tag operations

      - name: Determine version and create tag for main commits
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Get the latest tag or default to v0.0.0
            latest_tag=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "v0.0.0")
            # Extract version numbers (e.g., v1.0.0 -> 1, 0, 0)
            version_regex="v([0-9]+)\.([0-9]+)\.([0-9]+)"
            if [[ $latest_tag =~ $version_regex ]]; then
              major=${BASH_REMATCH[1]}
              minor=${BASH_REMATCH[2]}
              patch=${BASH_REMATCH[3]}
              # Increment patch version
              new_patch=$((patch + 1))
              version="v${major}.${minor}.${new_patch}"
            else
              version="v0.0.1"
            fi
            echo "Creating tag $version"
            git tag $version || echo "Tag $version already exists, using existing tag"
            git push origin $version || true
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "release_name=DelCraft-$version" >> $GITHUB_OUTPUT
            echo "changelog=Automated release for commit ${{ github.sha }} (Tag $version)" >> $GITHUB_OUTPUT
          else
            version=${{ github.ref_name }}
            echo "version=$version" >> $GITHUB_OUTPUT
            echo "release_name=DelCraft-$version" >> $GITHUB_OUTPUT
            echo "changelog=Release $version" >> $GITHUB_OUTPUT
          fi

      - name: Package addon
        run: |
          mkdir -p release/DelCraft
          cp DelCraft.toc core.lua db.lua release/DelCraft/
          cd release
          zip -r DelCraft-${{ steps.version.outputs.version }}.zip DelCraft
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: false
          files: release/DelCraft-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DelCraft-${{ steps.version.outputs.version }}
          path: release/DelCraft-${{ steps.version.outputs.version }}.zip
          retention-days: 7
