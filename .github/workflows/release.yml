name: Package and Release DelCraft Addon

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and release type
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "release_type=true" >> $GITHUB_OUTPUT
            echo "release_name=DelCraft-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "changelog=Automated pre-release for commit ${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_type=false" >> $GITHUB_OUTPUT
            echo "release_name=DelCraft-${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "changelog=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Package addon
        run: |
          mkdir -p release/DelCraft
          cp DelCraft.toc core.lua db.lua release/DelCraft/
          cd release
          zip -r DelCraft-${{ steps.version.outputs.version }}.zip DelCraft
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.release_name }}
          body: ${{ steps.version.outputs.changelog }}
          prerelease: ${{ steps.version.outputs.release_type }}
          files: release/DelCraft-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DelCraft-${{ steps.version.outputs.version }}
          path: release/DelCraft-${{ steps.version.outputs.version }}.zip
          retention-days: 7
